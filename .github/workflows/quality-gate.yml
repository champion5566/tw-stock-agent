name: Quality Gate
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/*.yml'
      - 'scripts/*.sh'
      - 'tests/**'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline quote-quality regression tests
        run: python -m unittest discover -s tests -p 'test_quote_quality.py' -v
      - name: Validate shell syntax
        run: bash -n scripts/publish_snapshots.sh
