name: Taiwan Stock Quote Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Taiwan stock quotes
        run: python fetch_quotes.py