name: Taiwan Stock Quote Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Taiwan stock quotes
        run: python fetch_quotes.py

      - name: Upload quote results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-stock-quotes
          path: quotes.json
          if-no-files-found: warn
          retention-days: 7