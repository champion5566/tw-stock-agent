name: Official Futures Provider Probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/live-night-probe-20261021
    paths:
      - probe_fugle_tx.py
      - .github/workflows/fugle-tx-probe.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fugle-marketdata>=2.5.0,<4'
      - name: Probe authenticated futures marketdata
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python probe_fugle_tx.py
      - uses: actions/upload-artifact@v4
        with:
          name: optional-fugle-tx-probe
          path: out/
          retention-days: 7
