name: IEObserve Facebook Instagram Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - audit_ieobserve_meta.py
      - .github/workflows/ieobserve-meta-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Test Facebook Instagram and official RSS
        run: python audit_ieobserve_meta.py
      - name: Save audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieobserve-meta-audit
          path: out/kol/ieobserve-meta-audit.json
          retention-days: 7
