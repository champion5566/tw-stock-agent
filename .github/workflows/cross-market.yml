name: Cross Market Source Verification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cross-market-data-20261021
    paths:
      - collect_cross_market.py
      - .github/workflows/cross-market.yml

permissions:
  contents: read

jobs:
  quote-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maintained quote client
        run: python -m pip install 'yfinance>=0.2.60,<2'
      - name: Test USA Japan Korea and futures
        env:
          REPORT_SLOT: evening
        run: python collect_cross_market.py
      - name: Save auditable test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-market-probe
          path: out/
          retention-days: 7
          if-no-files-found: warn
