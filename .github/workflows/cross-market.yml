name: Cross Market Source Verification

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning, evening, or nightclose'
        type: choice
        options:
          - morning
          - evening
          - nightclose
        default: evening
  schedule:
    - cron: '35 21 * * 1-5'  # 05:35 Taipei Tue-Sat (preceding night session): finished night session
    - cron: '30 0 * * 1-5'   # 08:30 Taipei: morning primary, allow collection before 08:38
    - cron: '35 0 * * 1-5'   # 08:35 Taipei: backup if primary schedule was missed
    - cron: '52 14 * * 1-5'  # 22:52 Taipei: fresh US/TX data before 22:58 cutoff / 23:00 report
  push:
    branches:
      - main
    paths:
      - preparation/requests/**/*.json
      - scripts/resolve_preparation.py
      - scripts/publish_overlay.py
      - scripts/reuse_night_observation.py
      - collect_cross_market.py
      - report_contract.py
      - report_scenarios.py
      - stock_metrics.py
      - session_calendar.py
      - instruments.py
      - alpaca_quotes.py
      - market_sources.py
      - quote_quality.py
      - snapshot_io.py
      - shioaji_quotes.py
      - .github/workflows/cross-market.yml
      - collect_shioaji_night.py

permissions:
  contents: write

concurrency:
  group: cross-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quote-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTION_PROFILE: report
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maintained quote client
        run: python -m pip install 'yfinance>=0.2.60,<2' 'shioaji>=1.2,<2' 'exchange_calendars>=4.5,<5'
      - name: Resolve validated preparation request or native schedule
        run: python scripts/resolve_preparation.py
      # Morning must be self-contained. The previous design read the market-data
      # workflow's separate published snapshot, which can be absent/stale when
      # scheduled runs are delayed, skipped, or execute out of order.
      - name: Collect Taiwan snapshot in the same report run
        if: env.REPORT_SLOT != 'nightclose'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python collect_market.py
      - name: Test USA Japan Korea and futures
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python collect_cross_market.py
      - name: Load published evidence for completed-night reuse
        if: env.REPORT_SLOT == 'morning'
        uses: actions/checkout@v4
        with:
          ref: data/snapshots
          path: stored-snapshots
      - name: Capture read-only TX night quote with timestamp
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: python collect_shioaji_night.py
      - name: Reuse completed night observation with original source and receipt clocks
        if: env.REPORT_SLOT == 'morning'
        run: python scripts/reuse_night_observation.py
      - name: Build small report consumer artifact with section-level readiness
        if: env.REPORT_SLOT != 'nightclose'
        shell: bash
        run: |
          args=()
          if [ "$PREPARATION_KIND" = 'PREVIEW' ]; then args+=(--experiment); fi
          python report_scenarios.py --scenario "$REPORT_SLOT" --market-root out "${args[@]}"
      - name: Save auditable test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-market-probe
          path: out/
          retention-days: 7
          if-no-files-found: warn
      - name: Publish versioned data snapshot
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: bash scripts/publish_snapshots.sh
