name: FinMind Futures Provider Check

on:
  workflow_dispatch:
  push:
    branches:
      - agent/reuse-finmind-futures-20261021
    paths:
      - probe_futures_provider.py
      - .github/workflows/finmind-futures-probe.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check existing documented FinMind futures endpoint
        run: python3 probe_futures_provider.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: futures-source-probe
          path: out/
          retention-days: 7
