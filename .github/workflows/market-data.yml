name: Market Data Snapshots

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning or evening'
        type: choice
        options:
          - morning
          - evening
        default: evening
  schedule:
    - cron: '25 0 * * 1-5'   # 08:25 Taipei
    - cron: '15 14 * * 1-5'  # 22:15 Taipei: refresh before 23:00 report
  push:
    branches:
      - main
    paths:
      - market_context.py
      - collect_market.py
      - instruments.py
      - market_sources.py
      - quote_quality.py
      - snapshot_io.py
      - ledger_review.py
      - .github/workflows/market-data.yml

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    outputs:
      slot: ${{ steps.resolved.outputs.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - id: slot
        name: Resolve slot
        shell: bash
        env:
          DISPATCH_SLOT: ${{ github.event.inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$DISPATCH_SLOT" ]; then
            echo "REPORT_SLOT=$DISPATCH_SLOT" >> "$GITHUB_ENV"
          elif [ "$SCHEDULE" = '25 0 * * 1-5' ]; then
            echo 'REPORT_SLOT=morning' >> "$GITHUB_ENV"
          else
            echo 'REPORT_SLOT=evening' >> "$GITHUB_ENV"
          fi
      - name: Export slot for research
        id: resolved
        run: echo "slot=$REPORT_SLOT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maintained calendar and HTTP client for official context
        run: python -m pip install 'exchange_calendars>=4.5,<5' 'requests>=2.31,<3'
      - name: Fetch dated public market data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 collect_market.py
      - name: Fill market-wide context from established official endpoints
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python market_context.py
      - name: Upload snapshot for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish immutable dated snapshot on data branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: bash scripts/publish_snapshots.sh

  ledger-review:
    needs: snapshot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin actual published data and settle independent ledger outcomes
        env:
          REVIEW_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git fetch origin refs/heads/data/snapshots
          python ledger_review.py --data-ref FETCH_HEAD --output "out/evaluations/ledger-review-$REVIEW_RUN_ID.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-review-${{ github.run_id }}
          path: out/
          retention-days: 14
      - name: Publish additive outcome evidence
        if: github.ref == 'refs/heads/main'
        run: bash scripts/publish_snapshots.sh

  research:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REPORT_SLOT: ${{ needs.snapshot.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: market-snapshot-${{ github.run_id }}
          path: out/
      - name: Resolve exact collected snapshot (safe across midnight)
        run: |
          snapshot=$(find out -maxdepth 2 -name "$REPORT_SLOT.json" -print -quit)
          test -n "$snapshot"
          echo "SOURCE_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
      - name: Install established research engine
        run: python -m pip install 'backtesting>=0.6,<1' 'pandas>=2,<3' 'numpy>=1.26,<3'
      - name: Build auditable research features and hypotheses
        run: python3 research_ledger.py
      - name: Run established backtesting.py baseline
        run: python3 backtest_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ github.run_id }}
          path: out/
          retention-days: 14
      - name: Publish research separately
        if: github.ref == 'refs/heads/main'
        run: |
          find out -type f -name '*.json' ! -name 'research-*' ! -name 'backtest-*' -delete
          bash scripts/publish_snapshots.sh
