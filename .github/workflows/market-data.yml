name: Market Data Snapshots

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning or evening'
        type: choice
        options:
          - morning
          - evening
        default: evening
  schedule:
    - cron: '25 0 * * 1-5'   # 08:25 Taipei
    - cron: '40 12 * * 1-5'  # 20:40 Taipei
  push:
    branches:
      - main
    paths:
      - collect_market.py
      - research_ledger.py
      - backtest_baseline.py
      - .github/workflows/market-data.yml

permissions:
  contents: write

concurrency:
  group: data-snapshots-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve slot
        shell: bash
        env:
          DISPATCH_SLOT: ${{ github.event.inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$DISPATCH_SLOT" ]; then
            echo "REPORT_SLOT=$DISPATCH_SLOT" >> "$GITHUB_ENV"
          elif [ "$SCHEDULE" = '25 0 * * 1-5' ]; then
            echo 'REPORT_SLOT=morning' >> "$GITHUB_ENV"
          else
            echo 'REPORT_SLOT=evening' >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install established backtest library
        run: python -m pip install 'backtesting>=0.6,<1' 'pandas>=2,<3' 'numpy>=1.26,<3'
      - name: Fetch dated public market data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 collect_market.py
      - name: Build auditable research features and hypotheses
        run: python3 research_ledger.py
      - name: Run established backtesting.py baseline
        run: python3 backtest_baseline.py
      - name: Upload snapshot for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish immutable dated snapshot on data branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: bash scripts/publish_snapshots.sh
