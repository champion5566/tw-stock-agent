name: IEObserve Source Reliability Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - audit_ieobserve_sources.py
      - .github/workflows/ieobserve-source-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Check actual HTML returned from source sites
        run: python audit_ieobserve_sources.py
      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieobserve-source-audit
          path: out/kol/ieobserve-source-audit.json
          retention-days: 7
          if-no-files-found: warn
