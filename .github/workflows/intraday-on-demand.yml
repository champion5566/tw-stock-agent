name: Intraday Read-only Quote On Demand
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intraday-on-demand-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Shioaji SDK
        run: python -m pip install 'shioaji>=1.2,<2'
      - name: Fetch read-only intraday quotes with timestamps
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: python collect_intraday.py
      - name: Save verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-quotes
          path: out/
          retention-days: 7
      - name: Publish dated snapshot
        if: github.ref == 'refs/heads/main'
        run: bash scripts/publish_snapshots.sh
