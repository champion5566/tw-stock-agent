name: Asia Intraday Read-Only Quotes

on:
  workflow_dispatch:
  schedule:
    # UTC 01:00-05:50 = Taipei 09:00-13:50 weekdays. GitHub scheduling can lag.
    - cron: '*/10 1-5 * * 1-5'

permissions:
  contents: write

concurrency:
  group: asia-intraday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing maintained Yahoo client
        run: python -m pip install 'yfinance>=0.2.60,<2'
      - name: Collect source-timestamped observations
        run: python collect_asia_intraday.py
      - name: Preserve run artifact even if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-intraday-observations
          path: out/
          retention-days: 3
      - name: Publish to data/snapshots
        env:
          REPORT_SLOT: intraday
        run: bash scripts/publish_snapshots.sh
