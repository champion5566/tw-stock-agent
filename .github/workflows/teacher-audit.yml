name: Teacher Evidence Audit
on:
  pull_request:
    paths:
      - report_handoff.py
      - paper_actions.py
      - opening_review.py
      - teacher_audit.py
      - execution_supervisor.py
      - docs/repair_queue.json
      - .github/workflows/teacher-audit.yml
  push:
    branches: [main]
    paths:
      - report_handoff.py
      - paper_actions.py
      - opening_review.py
      - teacher_audit.py
      - execution_supervisor.py
      - docs/repair_queue.json
      - .github/workflows/teacher-audit.yml
  workflow_run:
    workflows: [Cross Market Source Verification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: data/snapshots
          path: snapshots
          persist-credentials: false
      - name: Run teacher evidence audit
        run: |
          set -euo pipefail
          python teacher_audit.py snapshots | tee teacher-evidence.json
          python -m json.tool teacher-evidence.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-evidence
          path: teacher-evidence.json
      - name: Exercise an absent document on the teacher entry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          path=docs/__teacher_acceptance_nonexistent__.md
          status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$path?ref=$revision")
          echo "Pinned document lookup: $path ref=$revision HTTP=$status"
          test "$status" = 404
          echo "TEACHER_DOCUMENT_HTTP=$status" >> "$GITHUB_ENV"
      - name: Verify handoffs and settle original public ledgers
        if: ${{ !cancelled() }}
        run: |
          git fetch origin refs/heads/data/snapshots
          args=()
          if [ -n "${TEACHER_DOCUMENT_HTTP:-}" ]; then
            args+=(--missing-probe-status "$TEACHER_DOCUMENT_HTTP")
          fi
          python report_handoff.py --data-ref FETCH_HEAD --output report-handoff.json "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-handoff
          path: report-handoff.json
          if-no-files-found: error
