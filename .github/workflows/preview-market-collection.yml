name: Read-only market collection for manual previews

on:
  workflow_call:
    inputs:
      preview_slot:
        required: true
        type: string
      preview_stage:
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: cross-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quote-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTION_PROFILE: report
      PREVIEW_SLOT: ${{ inputs.preview_slot }}
      PREVIEW_STAGE: ${{ inputs.preview_stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maintained quote client
        run: python -m pip install 'yfinance>=0.2.60,<2' 'shioaji>=1.2,<2' 'exchange_calendars>=4.5,<5' 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3'
      - name: Resolve validated preparation request or native schedule
        run: |
          case "$PREVIEW_SLOT" in morning|evening) ;; *) exit 1 ;; esac
          {
            echo "REPORT_SLOT=$PREVIEW_SLOT"
            echo "PREPARATION_KIND=PREVIEW"
            echo "PREPARATION_STARTED_AT=$(TZ=Asia/Taipei date -Iseconds)"
          } >> "$GITHUB_ENV"
      # Morning must be self-contained. The previous design read the market-data
      # workflow's separate published snapshot, which can be absent/stale when
      # scheduled runs are delayed, skipped, or execute out of order.
      - name: Collect Taiwan snapshot in the same report run
        if: ${{ !cancelled() && env.REPORT_SLOT != '' && env.REPORT_SLOT != 'nightclose' && (success() || env.PREVIEW_STAGE != '') }}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python collect_market.py
      - name: Fill market-wide context from dated official sources and existing fallback
        if: ${{ !cancelled() && env.REPORT_SLOT != '' && env.REPORT_SLOT != 'nightclose' && (success() || env.PREVIEW_STAGE != '') }}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python market_context.py
      - name: Test USA Japan Korea and futures
        if: ${{ !cancelled() && env.REPORT_SLOT != '' && (success() || env.PREVIEW_STAGE != '') }}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python collect_cross_market.py
      - name: Capture read-only TX night quote with timestamp
        if: ${{ !cancelled() && env.REPORT_SLOT != '' && (success() || env.PREVIEW_STAGE != '') }}
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: python collect_shioaji_night.py
      - name: Build small report consumer artifact with section-level readiness
        if: ${{ !cancelled() && env.REPORT_SLOT != '' && env.REPORT_SLOT != 'nightclose' && (success() || env.PREVIEW_STAGE != '') }}
        shell: bash
        run: |
          args=()
          if [ "$PREPARATION_KIND" = 'PREVIEW' ]; then args+=(--experiment); fi
          python report_scenarios.py --scenario "$REPORT_SLOT" --market-root out "${args[@]}"
      - name: Verify current-time report bundle
        if: ${{ !cancelled() && env.REPORT_SLOT != '' && env.REPORT_SLOT != 'nightclose' && (success() || env.PREVIEW_STAGE != '') }}
        shell: bash
        run: |
          set -euo pipefail
          day=$(TZ=Asia/Taipei date +%F)
          path="out/reports/$day/$REPORT_SLOT.json"
          test -s "$path" || { echo "::error::Missing report bundle: $path"; exit 1; }
          python - "$path" "$REPORT_SLOT" "$day" <<'PY'
          import json, sys
          from pathlib import Path
          path, slot, day = sys.argv[1:]
          data = json.loads(Path(path).read_text(encoding="utf-8"))
          assert data.get("scenario") == slot, "report scenario mismatch"
          assert data.get("generated_at_taipei", "").startswith(day), "report date mismatch"
          print("REPORT_BUNDLE_BUILT", path)
          PY
      - name: Save auditable test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.preview_stage || 'cross-market-probe' }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
